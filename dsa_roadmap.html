<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Roadmap — 775 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1417; --surface:#161D21; --surface2:#1D262B; --border:#2A363C;
  --text:#E7EAE4; --muted:#8FA098; --muted2:#5E6E68;
  --accent:#4CC2A9; --accent-dim:#2E5A52;
  --easy:#6FCF97; --medium:#E8B04B; --hard:#E2685A;
  --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="dark"]){}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;min-height:calc(100vh - 54px);}

/* Hub Global Header */
.hub-header {
  background: rgba(22, 29, 33, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
  padding: 8px 20px;
}
.hub-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1400px;
  margin: 0 auto;
  gap: 12px;
}
.hub-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.hub-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  text-decoration: none;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.hub-brand:hover { text-decoration: none; }
.hub-brand-art {
  background: linear-gradient(135deg, #00e5ff 0%, #a855f7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hub-brand-sub {
  font-size: 0.62rem;
  font-family: var(--mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  display: block;
  line-height: 1;
  margin-top: 2px;
}
.hub-return-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.2s ease;
}
.hub-return-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  text-decoration: none;
}
.hub-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface2);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.hub-tab {
  padding: 5px 12px;
  border-radius: 6px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.hub-tab:hover {
  color: var(--text);
  background: rgba(255,255,255,0.05);
  text-decoration: none;
}
.hub-tab.active {
  background: var(--accent);
  color: #0F1417;
  font-weight: 700;
}
.hub-network {
  display: flex;
  align-items: center;
  gap: 6px;
}
.hub-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.hub-pill:hover {
  color: var(--text);
  border-color: var(--accent);
  text-decoration: none;
}
.hub-pill-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #00e5ff;
}
.hub-pill-linkedin:hover {
  color: #38bdf8;
  border-color: #0a66c2;
}
@media (max-width: 900px) {
  .hub-container { flex-wrap: wrap; }
  .hub-network { display: none; }
  .hub-tabs { width: 100%; justify-content: flex-start; overflow-x: auto; }
}

/* Sidebar */
.sidebar{
  width:280px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  padding:20px 16px; position:sticky; top:54px; height:calc(100vh - 54px); overflow-y:auto;
}
.brand{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin:0 0 4px;color:var(--text);}
.brand-sub{color:var(--muted);font-size:.8rem;margin:0 0 20px;}
.search-box{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:16px;}
.search-box:focus{outline:none;border-color:var(--accent);}
.filter-group{margin-bottom:18px;}
.filter-label{font-size:.78rem;color:var(--muted);margin-bottom:8px;display:block;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;}
.pill{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:.78rem;}
.pill.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.pill button{all:unset;cursor:pointer;}
select.cat-select{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;}
.progress-block{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.progress-num{font-family:var(--serif);font-size:1.8rem;color:var(--accent);margin:0;}
.progress-lbl{color:var(--muted);font-size:.78rem;margin:2px 0 8px;}
.progress-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;}
.month-nav{margin-top:18px;}
.month-nav-list{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;}
.month-btn{all:unset;padding:7px 10px;border-radius:6px;font-size:.82rem;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;}
.month-btn:hover{background:var(--surface2);}
.month-btn.active{background:var(--accent-dim);color:var(--accent);}
.month-btn .cnt{font-family:var(--mono);font-size:.72rem;opacity:.7;}

/* Main */
.main{flex:1;min-width:0;padding:32px 40px 80px;max-width:900px;}
.page-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px;}
.nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:.85rem;}
.nav-btn:hover{border-color:var(--accent);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.page-jump{font-family:var(--mono);color:var(--muted);font-size:.82rem;}

.month-header{margin-bottom:8px;}
.month-eyebrow{color:var(--muted2);font-size:.78rem;font-family:var(--mono);}
.month-title{font-family:var(--serif);font-size:2.1rem;font-weight:600;margin:4px 0 10px;}
.month-goal{color:var(--muted);font-size:.95rem;max-width:70ch;margin:0 0 28px;}
.phase-tag{display:inline-block;color:var(--accent);font-size:.8rem;margin-bottom:28px;border:1px solid var(--accent-dim);padding:4px 10px;border-radius:6px;}

.cat-block{margin-bottom:36px;}
.cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.cat-name{font-family:var(--serif);font-size:1.3rem;font-weight:600;}
.cat-count{color:var(--muted2);font-size:.78rem;font-family:var(--mono);}
.think-panel{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent-dim);border-radius:8px;padding:14px 16px;margin:10px 0 14px;font-size:.88rem;color:var(--muted);}
.think-panel strong{color:var(--text);}

.problem{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--surface);overflow:hidden;}
.problem-row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;}
.problem-row:hover{background:var(--surface2);}
.chk{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);}
.day-badge{font-family:var(--mono);color:var(--muted2);font-size:.78rem;width:42px;flex-shrink:0;}
.prob-title{flex:1;font-size:.92rem;min-width:0;}
.prob-title.done{color:var(--muted2);text-decoration:line-through;}
.diff-pill{font-size:.72rem;font-family:var(--mono);padding:2px 8px;border-radius:5px;flex-shrink:0;}
.diff-Easy{color:var(--easy);background:rgba(111,207,151,.12);}
.diff-Medium{color:var(--medium);background:rgba(232,176,75,.12);}
.diff-Hard{color:var(--hard);background:rgba(226,104,90,.12);}
.expand-icon{color:var(--muted2);font-size:.8rem;flex-shrink:0;transition:transform .15s;}
.problem.open .expand-icon{transform:rotate(90deg);}
.problem-detail{display:none;padding:2px 16px 16px 68px;border-top:1px solid var(--border);}
.problem.open .problem-detail{display:block;}
.detail-row{margin-bottom:10px;font-size:.86rem;}
.detail-label{color:var(--accent);font-size:.72rem;font-family:var(--mono);display:block;margin-bottom:3px;}
.detail-val{color:var(--text);}
.complexity{font-family:var(--mono);color:var(--muted);font-size:.8rem;}
.leet-link{font-size:.8rem;color:var(--muted);}

.empty-state{color:var(--muted);text-align:center;padding:60px 0;}
.search-results-title{font-family:var(--serif);font-size:1.6rem;margin-bottom:18px;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border);}
  .main{padding:24px 18px 60px;}
  .month-nav-list{max-height:160px;}
}
</style>
</head>

<script>
const DATA = {"monthGoals":{"Month 1":{"title":"FOUNDATION","goal":"Goal: Learn WHEN to use each basic pattern. Don't memorize solutions. Ask: what am I looking for What data structure gives O(1) lookup What technique avoids nested loops After Month 1: you should instantly recognize array, string, HashMap, two-pointer, sliding window, binary search problems."},"Month 2":{"title":"CORE DATA STRUCTURES","goal":"Goal: Master the behavior of Stack, Queue, Linked List, and Binary Trees. Stack = LIFO = matching/undo. Linked List = pointer manipulation. Tree = recursive structure (DFS mirrors tree shape). After Month 2: you should be comfortable with any tree traversal and most linked list problems."},"Month 3":{"title":"GRAPHS & COMBINATORICS","goal":"Goal: Model real-world problems as graphs. Learn BFS (shortest path), DFS (connectivity, cycles), Union Find (grouping), and Backtracking (all possibilities). After Month 3: you should be able to identify graph problems, choose BFS vs DFS, and implement backtracking cleanly."},"Month 4":{"title":"DYNAMIC PROGRAMMING & ADVANCED","goal":"Goal: Learn DP thinking. State = what changes between subproblems. Transition = how state n depends on n-1, n-2. Base cases = smallest solved examples. After Month 4: you have a complete DSA toolkit. Every interview pattern has been seen."}},"phaseDesc":{"Phase 1":"Phase 1 - Foundation: Arrays, Strings, HashMap, Two Pointers, Sliding Window, Binary Search","Phase 2":"Phase 2 - Core Data Structures: Bit, Stack, Sorting, Intervals, Linked List, Binary Tree, BST","Phase 3":"Phase 3 - Graphs & Combinatorics: Heap, BFS, DFS, Topological Sort, Union Find, Trie, Greedy, Backtracking","Phase 4":"Phase 4 - Dynamic Programming & Advanced: 1D DP, 2D DP, Advanced DP, Segment Tree, Design, SQL","Phase 5":"Phase 5 - Post Month-4 Daily Practice: Continue 3/day. Consistency is everything."},"categories":{"Array / Matrix":{"howToThink":"Ask yourself: do I need to track something AS I WALK the array Can I use index tricks For 2D matrix: am I traversing row-by-row, column-by-column, diagonally, or spirally Draw the traversal pattern first.","bruteForce":"Single or double loop. Track state (sum, max, count) as you go. For matrix: nested loops row then col. For spiral: peel outer layers one by one.","bfComplexity":"O(n) or O(n) | O(1)","optimalHint":"In-place index tricks: use the index itself to mark presence (negate, swap to correct position). For matrix: use direction arrays [(0,1),(1,0),(0,-1),(-1,0)] for cleaner traversal.","optComplexity":"O(n) | O(1)","mistakes":"1) Off-by-one in loop bounds. 2) Modifying array while iterating. 3) Confusing row/col indices. 4) Forgetting to handle empty input.","avoid":"AVOID: Extra array when in-place works. AVOID: Double loop when single pass suffices. AVOID: Manual 4-direction if-else - use direction array.","takeaway":"Array = index is your tool. Matrix = think of traversal direction first. In-place marking (negate values to track visited) = O(1) space hack for [1,n] range problems."},"String":{"howToThink":"Ask: is this about CHARACTERS and their FREQUENCIES Or about SUBSTRINGS Or about the string STRUCTURE (palindrome, anagram) Most string problems reduce to: count chars, compare sorted, or use sliding window.","bruteForce":"Count characters with a dict. Check all substrings O(n). Compare sorted strings. Always start with a simple character frequency count - it reveals the pattern.","bfComplexity":"O(n) | O(n)","optimalHint":"26-element array for lowercase only (faster than dict). Two-pointer for palindrome check. Sliding window for longest/shortest substring. Sorted string as canonical key for anagram grouping.","optComplexity":"O(n) | O(1) fixed alphabet","mistakes":"1) Forgetting strings are immutable - build list then ''.join(). 2) Not handling empty string. 3) Using sorted() when frequency count is enough. 4) Wrong palindrome check (two pointers, not reversal).","avoid":"AVOID: O(n) substring generation when sliding window works. AVOID: Converting to int for very large digit strings. AVOID: str.find() in a loop - that's O(n).","takeaway":"String toolkit: frequency array (26 chars), sorted string as canonical key (anagram), two pointers (palindrome), sliding window (longest valid substring). Most string problems use one of these four."},"HashMap / HashSet":{"howToThink":"Ask: do I need O(1) LOOKUP for something I've seen before Do I need to COUNT frequencies Any 'find the complement', 'group by property', 'detect duplicate', 'first not seen'  think HashMap/HashSet first.","bruteForce":"Nested loops: for each element, scan the rest. O(n). Or sort and scan adjacently. O(n log n).","bfComplexity":"O(n) | O(1)","optimalHint":"Single pass: put elements in a dict as you go. For each element, CHECK if complement/match is already there BEFORE adding current. defaultdict(list) for grouping. Counter for frequencies.","optComplexity":"O(n) | O(n)","mistakes":"1) Using list for membership check (O(n) per check). 2) Storing values when you need INDICES. 3) Using set when you need count. 4) Not handling duplicates in key collisions.","avoid":"AVOID: Sorting to find pairs - HashMap is O(n) vs O(n log n). AVOID: Two loops when one-pass + map works. AVOID: Counter when a simple set suffices for existence check.","takeaway":"HashMap = O(1) lookup superpower. Pattern: check first, store second. Uses: Two Sum complement, anagram grouping, frequency count, duplicate detection, consecutive sequence start detection."},"Two Pointers":{"howToThink":"Ask: does the problem involve a PAIR or TRIPLET that satisfies a condition Is the array SORTED or can it be sorted Two pointers from opposite ends: left=0, right=n-1. Move based on whether total is too big or too small.","bruteForce":"All pairs: two nested loops. O(n). Three nested for triplets. Always gets the right answer, just slowly.","bfComplexity":"O(n) | O(1)","optimalHint":"Sort if needed. left=0, right=n-1. While left<right: if condition met  record, move both. If total too small  left++. If total too large  right--. For 3Sum: fix one, two-pointer the rest.","optComplexity":"O(n log n) sort + O(n) scan | O(1)","mistakes":"1) Not sorting first (two pointers only work on sorted data). 2) Not handling duplicates (skip same elements for unique results). 3) Wrong move direction when condition fails.","avoid":"AVOID: HashMap when sorted two-pointers works - sorting is O(n log n) but cleaner. AVOID: Forgetting to skip duplicates for 3Sum/4Sum unique triplet/pair problems.","takeaway":"Two-pointer template after sorting: fix outer elements, inner left+right scan. 2Sum: one pass. 3Sum: fix i, two-pointer j and k. 4Sum: fix i and j, two-pointer the rest. Skip duplicates for unique results."},"Sliding Window":{"howToThink":"Ask: am I looking for the LONGEST or SHORTEST CONTIGUOUS window satisfying a condition Or a FIXED size window Variable: right expands always, left shrinks on violation. Fixed: add right element, remove element at [right-k].","bruteForce":"Check all (start, end) pairs. For each: verify condition. O(n) or O(n*k).","bfComplexity":"O(n) | O(k)","optimalHint":"Two pointers: right always moves right. When condition violated (too many distinct chars, sum too big): move left until valid again. Track best result only when window is valid. Use HashMap for what's in current window.","optComplexity":"O(n) | O(k) window contents","mistakes":"1) Shrinking left only once on violation - must keep shrinking until valid. 2) Updating best BEFORE checking validity. 3) Not maintaining frequency map of current window contents. 4) Variable vs fixed - choose right variant.","avoid":"AVOID: Restarting from scratch on violation - just move left pointer. AVOID: Two nested loops - one-pass two-pointer is O(n). AVOID: Binary search on window size - two-pointer is simpler.","takeaway":"Variable window template: right always moves. Left moves when invalid. Condition = when to shrink. Optimize = when to update answer. Fixed window: sum/count update by adding right[i] and removing left[i-k]."},"Binary Search":{"howToThink":"Ask: is the INPUT sorted Or can I BINARY SEARCH THE ANSWER (search on a range of values where I can check feasibility) Binary search cuts search space in half each step. lo=0, hi=n-1, mid=lo+(hi-lo)//2.","bruteForce":"Linear scan. O(n). Always works but too slow for sorted data or large answer ranges.","bfComplexity":"O(n) | O(1)","optimalHint":"Classic: lo=0, hi=n-1. While lo<=hi: mid=lo+(hi-lo)//2. Compare and update lo/hi. On Answer: lo=min_answer, hi=max_answer. Define: is_valid(mid). Binary search until lo==hi.","optComplexity":"O(log n) | O(1)","mistakes":"1) Integer overflow: use lo+(hi-lo)//2. 2) Infinite loop: always update lo=mid+1 or hi=mid-1, never lo=mid or hi=mid (unless specific template). 3) Off-by-one: lo<=hi terminates correctly with lo=mid+1/hi=mid-1.","avoid":"AVOID: Linear search on sorted data. AVOID: Recursive binary search (stack overflow risk). AVOID: Binary search on ANSWER without proving the predicate is monotonic.","takeaway":"Binary search on ANSWER: if is_valid(mid) is monotonic (true for all x>=threshold OR all x<=threshold), binary search the threshold. Examples: Koko bananas, ship capacity, minimum max distance."},"Prefix Sum":{"howToThink":"Ask: do I need the SUM of a SUBARRAY [l..r] repeatedly Or count subarrays with a certain sum Build prefix[i] = sum of first i elements. Range sum [l,r] = prefix[r+1] - prefix[l]. O(1) per query after O(n) build.","bruteForce":"For each query [l,r]: loop from l to r and sum. O(n) per query.","bfComplexity":"O(n) build + O(qn) queries | O(n)","optimalHint":"prefix[0]=0, prefix[i]=prefix[i-1]+arr[i-1]. Sum [l,r]=prefix[r+1]-prefix[l]. For subarray sum = k: use HashMap of prefix sums - if (current_prefix - k) in map: found a valid subarray.","optComplexity":"O(n) build + O(1) query | O(n)","mistakes":"1) Off-by-one: prefix[0]=0 (empty), prefix[i]=sum of first i elements. 2) Range formula: prefix[r+1]-prefix[l] not prefix[r]-prefix[l-1]. 3) For 2D: 4-rectangle formula.","avoid":"AVOID: Recomputing range sum each time. AVOID: Confusing 0-indexed and 1-indexed prefix arrays. For subarray sum = k: HashMap of prefix sums is the O(n) trick.","takeaway":"Prefix sum = trade O(n) build for O(1) query. Subarray sum = k: use prefix sum + HashMap (look for prefix[i] - k in map). 2D prefix sum: dp[i][j] = rectangle sum from (0,0) to (i,j)."},"Math":{"howToThink":"Ask: is there a mathematical PATTERN or FORMULA Digit problems, prime numbers, GCD, modular arithmetic, geometric series Think O(1) or O(sqrt(n)) solutions before resorting to O(n).","bruteForce":"Simulate step by step. Check every number. O(n) or O(n).","bfComplexity":"O(n) to O(n) | O(1)","optimalHint":"Key formulas: 1+2+...+n = n(n+1)/2. GCD: gcd(a,b)=gcd(b,a%b). Prime sieve: O(n log log n). Power of 2: n>0 and n&(n-1)==0. Digit count: int(log10(n))+1. Mod arithmetic: (a+b)%m = ((a%m)+(b%m))%m.","optComplexity":"O(1) to O(sqrt(n)) | O(1)","mistakes":"1) Integer overflow (multiply before checking). 2) Float arithmetic for integer problems - use integer division. 3) Wrong edge cases: n=0, n=1, negatives. 4) Checking divisibility wrong: use modulo, not division comparison.","avoid":"AVOID: Brute force when a closed-form formula exists. AVOID: Floating point for exact integer arithmetic. AVOID: Checking all numbers up to n for primality - sieve of Eratosthenes for multiple primes.","takeaway":"Math problem signals: 'without extra space', 'constant time', very large n. Check: is there a Gauss sum A geometric series A number theory property O(sqrt(n)) comes from checking divisors up to sqrt(n)."},"Fast/Slow Pointers":{"howToThink":"Ask: is there a potential CYCLE Or do I need the MIDDLE of a linked list in one pass Fast moves 2 steps, slow moves 1 step. If cycle: they meet. If no cycle: fast reaches end. When fast ends, slow is at the middle.","bruteForce":"Visited set: add each node, detect first repeat. For middle: count total nodes, traverse to count//2.","bfComplexity":"O(n) | O(n) visited set","optimalHint":"slow=head, fast=head. While fast and fast.next: slow=slow.next, fast=fast.next.next. If cycle: when slow==fast, reset slow to head, advance both by 1 until they meet again (cycle start). Middle: fast=head.next to get upper middle.","optComplexity":"O(n) | O(1)","mistakes":"1) Starting fast at head vs head.next changes which middle you get - be careful. 2) Cycle start: reset slow to HEAD (not start), keep fast at meeting point, move both by 1. 3) Null check: fast AND fast.next both needed.","avoid":"AVOID: Visited HashSet for cycle detection - works but O(n) space. AVOID: Counting length separately - fast/slow finds middle without knowing length. AVOID: Only phase 1 - finding cycle start needs phase 2.","takeaway":"Floyd's cycle: Phase 1 = detect (fast=2x speed). Phase 2 = find start (reset slow to head, both move 1x). Why Math proves slow and fast meet exactly at cycle start in phase 2."},"Bit Manipulation":{"howToThink":"Ask: is this about BINARY representation Powers of 2 Finding ODD ONE OUT among duplicates XOR is your best friend: A XOR A = 0 (cancel), A XOR 0 = A (preserve). Bit tricks often turn O(n) problems into O(1).","bruteForce":"Use arithmetic or counting. Check each bit explicitly with a loop.","bfComplexity":"O(n) to O(log n) | O(1)","optimalHint":"Key tricks: XOR cancels pairs (find single number). n&(n-1) clears lowest bit (power-of-2 check: result==0). n&(-n) isolates lowest bit. n>>k checks k-th bit. Kernighan's bit count: while n: n&=n-1; count++.","optComplexity":"O(log n) or O(1) | O(1)","mistakes":"1) Confusing bitwise & with logical and. 2) Operator precedence: (n & mask) needs parentheses in conditions. 3) Python: no overflow, arbitrary precision. Java/C++: watch sign bit in right shift. 4) Missing the XOR approach for duplicate-detection problems.","avoid":"AVOID: Converting to binary string for bit counting when Kernighan's is O(popcount). AVOID: Loop for power-of-2 check - one line: n>0 and n&(n-1)==0. AVOID: Using division for checking bits - use & and >> instead.","takeaway":"Bit tricks to memorize: XOR cancels duplicates. n&(n-1) removes lowest set bit. n&(-n) isolates lowest set bit. These 3 solve 80% of bit problems. XOR is commutative and associative - order of XOR doesn't matter."},"Stack":{"howToThink":"Ask: do I need to process things in LIFO order Do recent elements CANCEL OUT or MATCH with upcoming ones Think: matching brackets, 'undo last step', expression evaluation. Stack (list in Python) with append() and pop().","bruteForce":"Handle all cases with if-else conditions. Recursion (implicit stack). Correct but complex.","bfComplexity":"O(n) | O(n)","optimalHint":"For matching: push opens, pop and match closes. For monotonic: push index, pop when current breaks order. For calculator: two stacks (numbers and operators). Always check stack empty before pop.","optComplexity":"O(n) | O(n)","mistakes":"1) Not checking stack is empty before popping (IndexError). 2) Not checking stack is empty at END (for valid-bracket type problems). 3) Using queue when you need LIFO. 4) Wrong mapping: ')' maps to '(' (not to itself).","avoid":"AVOID: Complex if-else without stack for bracket matching. AVOID: Recursion deep enough to overflow stack - iterative with explicit stack is safer. AVOID: deque when list (as stack) is simpler.","takeaway":"Stack = LIFO. Use for: matching pairs (brackets), expression evaluation, DFS simulation, monotonic order maintenance. stack[-1] peeks top without removing. Empty stack at end = all matched."},"Monotonic Stack":{"howToThink":"Ask: do I need the NEXT GREATER or NEXT SMALLER element for each position Or the largest rectangle in a histogram Monotonic stack = stack whose elements are always in increasing or decreasing order.","bruteForce":"For each element, scan all elements to its right to find next greater. O(n).","bfComplexity":"O(n) | O(1)","optimalHint":"Store INDICES in stack (not values!). Maintain monotonically increasing (for next greater) or decreasing stack. When new element breaks order: POP - current element IS the next greater/smaller for popped elements. Push current index.","optComplexity":"O(n) | O(n) - each element pushed/popped at most once","mistakes":"1) Storing values instead of indices - you need position for distance calculation. 2) Wrong monotonicity direction. 3) Not processing remaining stack after loop ends (those have no next greater - answer is -1 or n).","avoid":"AVOID: O(n) nested scan for next greater - one-pass monotonic stack is O(n). AVOID: Storing full list to pop from middle - monotonic stack only pops from top.","takeaway":"Monotonic stack insight: when current element breaks order, POP - and current element IS the answer for all popped elements. After full loop: remaining stack elements have no next greater (answer = -1 or n or 0)."},"Sorting":{"howToThink":"Ask yourself: do I need to track something AS I WALK the array Can I use index tricks For 2D matrix: am I traversing row-by-row, column-by-column, diagonally, or spirally Draw the traversal pattern first.","bruteForce":"Single or double loop. Track state (sum, max, count) as you go. For matrix: nested loops row then col. For spiral: peel outer layers one by one.","bfComplexity":"O(n) or O(n) | O(1)","optimalHint":"In-place index tricks: use the index itself to mark presence (negate, swap to correct position). For matrix: use direction arrays [(0,1),(1,0),(0,-1),(-1,0)] for cleaner traversal.","optComplexity":"O(n) | O(1)","mistakes":"1) Off-by-one in loop bounds. 2) Modifying array while iterating. 3) Confusing row/col indices. 4) Forgetting to handle empty input.","avoid":"AVOID: Extra array when in-place works. AVOID: Double loop when single pass suffices. AVOID: Manual 4-direction if-else - use direction array.","takeaway":"Array = index is your tool. Matrix = think of traversal direction first. In-place marking (negate values to track visited) = O(1) space hack for [1,n] range problems."},"Interval":{"howToThink":"Ask: are the inputs INTERVALS [start, end] Do I need to MERGE overlapping, INSERT a new interval, or find MINIMUM COVERAGE Sort intervals by start time (or end time for scheduling). Then process linearly.","bruteForce":"Check all pairs of intervals for overlap. O(n). Or insert and re-sort each time.","bfComplexity":"O(n) | O(n)","optimalHint":"Sort by start. Merge: if current.start <= last_end  merge (update end = max(last_end, current.end)). Insert: 3 phases (before new, merge with new, after new). Schedule: sort by END, greedy pick non-overlapping.","optComplexity":"O(n log n) sort + O(n) scan | O(n)","mistakes":"1) Not sorting first. 2) Wrong merge condition: overlap if next.start <= current.end (not strictly less than). 3) For minimum arrows: sort by end, not start. 4) Forgetting to update merged end to max(current_end, next_end).","avoid":"AVOID: Checking all pairs for overlap - sort first then linear scan. AVOID: Sorting by start for minimum arrows problem (sort by end). AVOID: Missing the 3-phase approach for interval insertion.","takeaway":"Interval patterns: MERGE = sort by start, check overlap, extend end. INSERT = 3 phases. SCHEDULE (max non-overlapping) = sort by END, greedy. MINIMUM COVER = sort by start, extend furthest. Sort criterion depends on the goal."},"Linked List":{"howToThink":"Ask: what POINTER MANIPULATION do I need Draw the list on paper with 3-4 nodes. Identify which pointers to use and what ORDER to update them. GOLDEN RULE: always SAVE next=curr.next BEFORE modifying curr.next.","bruteForce":"Convert to array, do operation, rebuild. O(n) space but gets you thinking clearly first.","bfComplexity":"O(n) | O(n)","optimalHint":"In-place: prev=None, curr=head. For each step: SAVE next first, then modify curr.next. Use dummy head node to simplify edge cases (insertion/deletion at head). Fast/slow for cycle/middle.","optComplexity":"O(n) | O(1)","mistakes":"1) Losing next pointer before saving - ALWAYS: next_node = curr.next BEFORE curr.next = prev. 2) Wrong node to return (return prev not curr after reversal). 3) Off-by-one for k-th node (count carefully).","avoid":"AVOID: Converting to array unless problem explicitly involves array. AVOID: Changing values instead of pointers (usually not allowed). AVOID: Not using dummy head - it eliminates half the edge cases.","takeaway":"Linked list pattern: save next  modify  advance. Three-pointer reversal: prev=None, curr=head. Save next. curr.next=prev. prev=curr. curr=saved_next. Dummy head = new ListNode(0); dummy.next=head."},"Binary Tree DFS":{"howToThink":"Ask: do I need to explore ALL paths or process EVERY node individually Think recursively: what info do I need from LEFT subtree From RIGHT subtree What do I RETURN to parent The recursive structure mirrors the tree structure.","bruteForce":"Iterative DFS with explicit stack. Collect all results. Process. Same O(n) but messier.","bfComplexity":"O(n) | O(h) stack space","optimalHint":"Recursive template: if not node: return base_case. left = solve(node.left). right = solve(node.right). return combine(left, right, node.val). Return PAIRS (rob/skip, min/max) when you need multiple states per node.","optComplexity":"O(n) | O(h) - O(log n) balanced, O(n) worst case","mistakes":"1) Base case: check node is None BEFORE accessing node.val. 2) Returning single value when two are needed (forces O(n) recomputation). 3) Confusing preorder/inorder/postorder direction.","avoid":"AVOID: Global variables for aggregation - use return values to pass info up. AVOID: Re-traversal from each node (O(n)) - return what you need from each recursive call. AVOID: BFS for depth-first structural problems.","takeaway":"DFS tree template: base_case (null)  recurse left  recurse right  combine. Return TUPLES when node needs to return multiple values (tree DP). Preorder = root first. Inorder = root middle (sorted for BST). Postorder = root last."},"Binary Tree BFS":{"howToThink":"Ask: do I need LEVEL-BY-LEVEL processing Or MINIMUM depth Or the RIGHTMOST node at each level BFS processes nodes level by level using a queue. Perfect for shortest path, level-order traversal, width/level count.","bruteForce":"DFS with depth tracking, store in dict[depth], sort by depth. Correct but O(n log n).","bfComplexity":"O(n log n) | O(n)","optimalHint":"deque([root]). While queue: level_size = len(queue). for _ in range(level_size): node = popleft(), process, add non-null children. This inner loop = exactly one level. Rightmost = last node in each level.","optComplexity":"O(n) | O(w) where w = max width","mistakes":"1) Not capturing level_size BEFORE processing (queue grows as you add children). 2) Adding None children to queue - check before adding. 3) Forgetting popleft is O(1) for deque but O(n) for list.","avoid":"AVOID: list.pop(0) - use collections.deque with popleft(). AVOID: DFS for minimum depth (DFS finds deepest first, not shallowest). AVOID: Tracking depth in queue when the outer loop level approach is cleaner.","takeaway":"BFS level template: while queue: size=len(queue). for _ in range(size): node=popleft. Add non-null children. Process level. This pattern = basis for: level order, zigzag, right side view, minimum depth, average of levels."},"BST":{"howToThink":"Ask: is this a BINARY SEARCH TREE If yes, exploit BST property: left < node < right for every node. This means INORDER gives SORTED sequence. Any search/find can skip half the tree  O(h) instead of O(n).","bruteForce":"Treat as general binary tree. DFS/BFS over all nodes without using BST property. O(n).","bfComplexity":"O(n) | O(h)","optimalHint":"Navigate using BST property: if target < node.val  go LEFT only. If target > node.val  go RIGHT only. Inorder traversal = sorted output. Validate BST: pass [min, max] range to each recursive call.","optComplexity":"O(h) = O(log n) balanced | O(1) iterative","mistakes":"1) Not exploiting BST property (loses O(log n) advantage). 2) Validation: only checking parent-child but not full range [min,max] for each node. 3) Inorder: leftrootright (not preorder). 4) Finding successor/predecessor: track previous visited node.","avoid":"AVOID: General tree algorithms on BST - you lose O(log n). AVOID: Only comparing to direct parent for BST validity - must check entire valid range.","takeaway":"BST = sorted tree. KEY: inorder traversal = sorted array. Navigation: go left if smaller, right if larger. Validity: each node must be in (min_ancestor, max_ancestor) range. LCA: first node where paths to p and q diverge."},"Heap":{"howToThink":"Ask: do I need REPEATED access to minimum or maximum Or Kth largest/smallest dynamically Heap gives O(log n) insert, O(1) peek, O(log n) remove-min. Python heapq = MIN-heap. Negate values to simulate MAX-heap.","bruteForce":"Sort everything. Find kth in sorted array. O(n log n) upfront. Or scan for max each time O(n) per operation.","bfComplexity":"O(n log n) | O(n)","optimalHint":"For K-largest: MIN-heap of size k. If new > heap[0]: heapreplace(heap, new). For median stream: two heaps. For K-smallest from multiple sorted lists: min-heap of (value, list_idx, elem_idx).","optComplexity":"O(n log k) | O(k)","mistakes":"1) Python is MIN-heap only - negate for MAX-heap: push -x, pop returns -result. 2) K-largest uses MIN-heap (keeps k largest, evicts smallest when size k+1). 3) heap[0] peeks top without removing (O(1)). 4) heapq.nlargest(k, arr) is simpler for one-time k-largest.","avoid":"AVOID: Re-sorting for each new element. AVOID: max() in a loop - O(n) per call. AVOID: heappush then sort - heappush already maintains heap order. AVOID: Using max-heap for k-largest - use MIN-heap.","takeaway":"Heap patterns: K-largest  min-heap size k. K-smallest  max-heap size k. Merge K sorted  min-heap with (value, list_id, index). Median stream  two heaps (max-heap lower half, min-heap upper half)."},"Graph BFS":{"howToThink":"Ask: am I finding the SHORTEST path in an unweighted graph Or visiting nodes level by level BFS guarantees shortest path in unweighted graphs. Mark visited WHEN ADDING to queue (not when removing) to avoid TLE.","bruteForce":"DFS all paths, track minimum. Or try every path. Exponential without pruning.","bfComplexity":"Exponential | O(V+E)","optimalHint":"visited = set(); queue = deque([(start, 0)]); visited.add(start). While queue: node, dist = popleft(). If node == target: return dist. For each neighbor: if not in visited: visited.add(neighbor), append(neighbor, dist+1).","optComplexity":"O(V + E) | O(V)","mistakes":"1) Marking visited when DEQUEUING (too late - causes TLE from repeated processing). Mark when ENQUEUING. 2) Not handling disconnected graph. 3) Building wrong adjacency structure.","avoid":"AVOID: DFS for shortest path - DFS finds A path, not THE SHORTEST. AVOID: list.pop(0) - use deque.popleft(). AVOID: Single-source BFS when multi-source is needed (e.g., all gates to all rooms simultaneously).","takeaway":"BFS = shortest path in unweighted graph. Mark visited ON ENQUEUE. Multi-source BFS: add ALL sources initially. Level-by-level: use len(queue) trick. BFS on grid: check 4 neighbors, check bounds, check not wall."},"Graph DFS":{"howToThink":"Ask: am I counting CONNECTED COMPONENTS Checking for CYCLES Finding ALL paths DFS explores as deep as possible. Use visited set for undirected graphs. Use three colors (white/gray/black) for directed graph cycle detection.","bruteForce":"Try all paths from start. Union-Find for connectivity. BFS for everything. Usually works but different complexity.","bfComplexity":"O(V+E) | O(V+E)","optimalHint":"visited = set(). def dfs(node): visited.add(node). for neighbor: if not visited: dfs(neighbor). For directed cycle: state = {0: unvisited, 1: in-progress, 2: done}. In-progress node reachable = cycle.","optComplexity":"O(V + E) | O(V) recursion stack","mistakes":"1) Not adding to visited at start of dfs ( infinite loop). 2) Directed cycle: must use 3 states (in-progress state is the key). 3) Undirected cycle: track parent to avoid trivial back-edge. 4) Not building adjacency list first.","avoid":"AVOID: BFS when you need ALL paths (BFS state management is harder). AVOID: 2-color cycle detection for directed graphs (need 3 colors). AVOID: Recursive DFS for very deep graphs (recursion limit) - use iterative.","takeaway":"DFS = go deep, backtrack. Three colors for directed cycle: WHITE (unseen), GRAY (in current path = cycle if reached again), BLACK (fully explored = safe). Components = count separate DFS call starts."},"Topological Sort":{"howToThink":"Ask: is there a DEPENDENCY relationship 'Must do A before B' Model as directed graph. Topological sort = valid ordering respecting all dependencies. If a cycle exists, no valid order exists.","bruteForce":"Try all permutations, check if valid. O(n! * V).","bfComplexity":"O(n! * V) | O(V)","optimalHint":"Kahn's BFS: compute in-degree for each node. Queue all nodes with in-degree 0. Process: dequeue, add to result, reduce neighbor in-degrees. If neighbor in-degree becomes 0: enqueue. If result.size < V: cycle exists.","optComplexity":"O(V + E) | O(V)","mistakes":"1) Not detecting cycle: if len(result) < n after Kahn's  cycle. 2) Wrong edge direction (prerequisite A for B means edge AB, B's in-degree increases). 3) Not handling multiple valid orderings.","avoid":"AVOID: DFS topological sort for beginners - Kahn's BFS is more intuitive. AVOID: Ignoring cycle detection. AVOID: Undirected graph approach on directed dependency graphs.","takeaway":"Topological sort = ordering by in-degree. In-degree 0 = no prerequisites = start. Cycle = some nodes never reach in-degree 0. Classic problems: course schedule, build order, compilation order, task scheduling."},"Union Find":{"howToThink":"Ask: am I GROUPING elements Checking if two elements are in the SAME GROUP Dynamically merging groups Union-Find (Disjoint Set Union) handles these in O((n))  O(1) per operation with path compression + union by rank.","bruteForce":"BFS/DFS to check connectivity each time. O(V+E) per query.","bfComplexity":"O(V+E) per query | O(V+E)","optimalHint":"parent=[i for i in range(n)]. find(x): if parent[x]!=x: parent[x]=find(parent[x]). union(x,y): parent[find(x)]=find(y). Cycle in undirected: if find(u)==find(v) before union  cycle. Components: count where parent[i]==i.","optComplexity":"O((n)) per op  O(1) | O(V)","mistakes":"1) Not using path compression (degrades to O(n)). 2) Forgetting union by rank. 3) Comparing parent[i] directly instead of using find() (must follow path to root). 4) Not checking for cycle before union.","avoid":"AVOID: BFS/DFS per connectivity query - Union-Find is amortized O(1). AVOID: Building full graph when only connectivity matters. AVOID: Using Union-Find on directed graphs - it's for UNDIRECTED only.","takeaway":"Union-Find template: parent array + find (path compression) + union (by rank). Cycle detection: find(u)==find(v) before union  cycle. Component count: number of nodes where parent[i]==i (self-root)."},"Trie":{"howToThink":"Ask: is this about WORDS with common PREFIXES Autocomplete 'Does any word START WITH X' Trie stores words character by character, sharing common prefixes. Each path from root to marked leaf = one word.","bruteForce":"Store words in a list. For each lookup: check every word. O(n*m) per search.","bfComplexity":"O(n*m) per search | O(n*m) storage","optimalHint":"TrieNode: dict children, bool is_end. Insert: for each char, create child if missing, mark is_end. Search: traverse char by char, return False if char missing. Prefix: same as search but don't check is_end.","optComplexity":"O(m) per operation | O(n*m) storage","mistakes":"1) Not setting is_end on last char - prefix and word lookups both succeed. 2) Confusing 'prefix exists' (stop at last prefix char) and 'word exists' (check is_end). 3) For word search in grid: build Trie of ALL words, DFS with pruning saves huge time.","avoid":"AVOID: Restarting word search for each word without Trie - O(words * n * m * 4^L). AVOID: HashSet for prefix existence (can't check if X is a prefix of any stored word).","takeaway":"Trie = prefix-aware word storage. O(m) insert/search where m=word length. Power: shared prefixes share nodes. Must-use when: autocomplete, prefix matching, finding words with common prefix, Word Search II grid problem."},"Greedy":{"howToThink":"Ask: at each step, is there a LOCALLY OPTIMAL choice that leads to the GLOBAL OPTIMUM Greedy = make the best available choice now, never reconsider. Requires proof by exchange argument: 'swapping to any other choice can't improve result'.","bruteForce":"Try all combinations or use DP. O(2^n) or O(n).","bfComplexity":"O(2^n) to O(n) | O(n)","optimalHint":"Usually: SORT by some criterion (end time, size, etc.). Then greedily pick/schedule. Key: what to optimize at each step For intervals: sort by end time, always pick earliest-ending non-overlapping interval.","optComplexity":"O(n log n) dominated by sort | O(1)","mistakes":"1) Applying greedy when it's not provably correct (think of counterexamples). 2) Wrong sorting criterion (sort by END not start for interval scheduling). 3) Missing edge cases in greedy choice.","avoid":"AVOID: DP when greedy is provably correct - O(n log n) vs O(n). AVOID: Greedy without proving optimality - always ask 'if I make a different choice here, can I always do at least as well'","takeaway":"Greedy validity: exchange argument - can you always swap the greedy choice with any other choice without worsening the result Common patterns: sort by end time (intervals), always take largest/smallest, fill from left."},"Backtracking":{"howToThink":"Ask: do I need ALL possible combinations/permutations/subsets Or to find ONE valid configuration (Sudoku, N-Queens) Backtracking = DFS + undo. Template: CHOOSE  EXPLORE  UNCHOOSE. Stop early when constraint violated (pruning).","bruteForce":"Generate all possibilities without pruning. Enumerate everything. Same complexity but much slower in practice without early termination.","bfComplexity":"O(2^n) to O(n!) | O(n)","optimalHint":"def backtrack(start, path): if goal: results.append(path[:]). for i in range(start, n): if valid: path.append(choice). backtrack(i+1, path). path.pop(). Combinations: use start index. Permutations: use used[] array.","optComplexity":"O(2^n) to O(n!) with pruning | O(n) depth","mistakes":"1) Forgetting path.pop() (undo step) - path gets contaminated across branches. 2) Appending path (reference) not path[:] (copy) to results. 3) Wrong start index - using 0 for combinations causes duplicates. 4) Not pruning: add constraint checks BEFORE recursing.","avoid":"AVOID: Global mutable path without undoing. AVOID: Generating all then filtering - prune DURING generation. AVOID: Permutation approach (used[]) for combination problems - use start_index instead.","takeaway":"Backtracking template: choose  recurse  unchoose. For COMBINATIONS: start_index prevents reuse. For PERMUTATIONS: used[] array prevents reuse. Pruning = 'if current state is invalid, return early'. Pruning is what makes backtracking fast."},"1D DP":{"howToThink":"Ask: can I express the answer for SIZE n in terms of smaller sizes Do subproblems OVERLAP (same sub-problem computed multiple times) DP = memoized recursion. State = what changes between subproblems. Transition = how state n depends on n-1, n-2, etc.","bruteForce":"Plain recursion without memoization. Recomputes same subproblems exponentially many times.","bfComplexity":"O(2^n) | O(n) recursion stack","optimalHint":"Bottom-up: dp[0]=base, dp[1]=base. For i in range(2, n+1): dp[i] = f(dp[i-1], dp[i-2], ...). Identify STATE (what varies), TRANSITION (how dp[i] depends on previous), BASE CASES. Space-optimize: if dp[i] only needs last 2 values, use two variables.","optComplexity":"O(n) | O(n)  O(1) with space optimization","mistakes":"1) Wrong base cases (off by one). 2) Wrong transition formula. 3) Initializing max_sum to 0 (wrong for all-negative arrays - init to nums[0]). 4) Forgetting to space-optimize when only last 1-2 values needed.","avoid":"AVOID: Recursion without memoization - exponential. AVOID: 2D DP when 1D suffices. AVOID: Space optimizing before verifying correctness - get correct first. AVOID: Forgetting that knapsack 0/1 needs BACKWARD iteration.","takeaway":"DP mantra: define state  write recurrence  handle base cases  fill bottom-up  optimize space. Classic 1D DP: Fibonacci (prev two), house robber (skip one), coin change (all previous), LIS (all previous smaller)."},"2D DP":{"howToThink":"Ask: does the state require TWO parameters Are you matching two SEQUENCES (LCS, edit distance) or finding path in a GRID dp[i][j] = answer for first i of sequence1 and first j of sequence2, or answer at cell (i,j).","bruteForce":"DFS/backtracking: try all paths or all alignments. Exponential.","bfComplexity":"O(2^(m+n)) | O(m+n)","optimalHint":"dp[0][...] and dp[...][0] = base cases. dp[i][j] depends on dp[i-1][j], dp[i][j-1], dp[i-1][j-1]. For grid path: only right+down  from top and left. For sequences: match (diagonal) or skip (left/above).","optComplexity":"O(m*n) | O(m*n)  O(min(m,n)) space-optimized","mistakes":"1) Wrong base case (first row and col initialization). 2) Wrong transition for the problem type (edit distance has 3 cases, LCS has 2). 3) Not distinguishing count paths (add) from min cost (min). 4) 1-indexed dp vs 0-indexed array - be careful with offsets.","avoid":"AVOID: DFS without memoization on grids. AVOID: Confusing right+down movement with all-4-directions. AVOID: 2D DP when 1D (with rolling array) suffices.","takeaway":"2D DP grid: dp[i][j] = optimal value at (i,j). Common: unique paths (+= from left and above), min path sum (min from left or above), edit distance (3-way min), LCS (diagonal if match, else max of left/above)."},"Advanced DP":{"howToThink":"Ask: does the DP need more than 2 dimensions Or involves INTERVALS, BITMASKS, TREES, or DIGIT constraints Interval DP: dp[l][r] = answer for subarray/substring [l..r]. Bitmask DP: dp[mask] for subsets (n20). Tree DP: return multiple states from DFS.","bruteForce":"Brute force all possibilities: exponential for subset problems, O(n!) for permutation-based.","bfComplexity":"Exponential | O(2^n)","optimalHint":"Interval DP: iterate by LENGTH (outer loop=length, inner=start). dp[l][r] = min over all split points k: dp[l][k] + dp[k+1][r] + cost. Bitmask DP: dp[mask] where bits represent chosen elements. Tree DP: return tuple (state1, state2) from DFS.","optComplexity":"O(n) interval | O(2^n * n) bitmask | O(n) tree | varies","mistakes":"1) Interval DP: iterating by l and r directly instead of by LENGTH causes wrong computation order. 2) Bitmask: n must be 20 (2^20 = ~1M states). 3) Tree DP: returning one value forces recomputation - return tuple. 4) Stock DP: need to handle k-transaction limit edge case (kn/2 means unlimited).","avoid":"AVOID: Interval DP without length-ordered iteration. AVOID: Bitmask DP for n>20 - infeasible. AVOID: Tree DP with HashMap when returning tuple from DFS is cleaner.","takeaway":"Advanced DP state design: interval = (l, r). Bitmask = integer where each bit = one item. Tree = (robbed, not_robbed) or (with_item, without_item). Always define state clearly before writing transitions."},"Segment Tree / BIT":{"howToThink":"Ask: do I need RANGE QUERIES (sum/min/max) AND POINT UPDATES on a dynamic array BIT (Fenwick Tree) handles range SUM + point update in O(log n). Segment Tree handles ANY range operation + updates in O(log n).","bruteForce":"Update: modify all affected cached results. Query: sum/scan the full range. O(n) per operation.","bfComplexity":"O(n) per op | O(n)","optimalHint":"BIT: 1-indexed. update(i, delta): while i<=n: tree[i]+=delta; i+=i&-i. query(i): while i>0: sum+=tree[i]; i-=i&-i. Range [l,r]: query(r)-query(l-1). Segment Tree: build O(n), update O(log n), query O(log n).","optComplexity":"O(log n) per op | O(n)","mistakes":"1) BIT is 1-indexed - convert 0-indexed input to 1-indexed. 2) Segment tree lazy propagation needed for range updates (not just point updates). 3) Coordinate compression when values are large but count is small.","avoid":"AVOID: BIT for non-cumulative operations (min/max) - use Segment Tree. AVOID: Segment Tree without lazy propagation for range updates. AVOID: Array of prefix sums for dynamic (changing) data.","takeaway":"BIT = simplest O(log n) structure for dynamic prefix sums. 3 lines: update and query. Segment Tree = general O(log n) for any associative range operation. Use BIT when you only need sum; Segment Tree for anything else."},"Design":{"howToThink":"Ask: what OPERATIONS need O(1) or O(log n) time Design = choose data structures to meet time complexity requirements. LRU = HashMap + doubly linked list (O(1) get and put). Think about each operation independently.","bruteForce":"Use one simple structure for everything. List for LRU, dict for everything else. O(n) per operation but simple.","bfComplexity":"O(n) per op | O(n)","optimalHint":"Combine structures: HashMap for O(1) lookup + linked list/heap/deque for ordering. LRU: dict + doubly linked list. Median: two heaps. Rate limiter: queue with timestamps. LFU: two hashmaps + doubly linked lists.","optComplexity":"O(1) to O(log n) per op | O(n)","mistakes":"1) Using only one structure when two would give O(1) for both operations. 2) Not handling edge cases (empty, capacity 1, duplicate keys). 3) For LRU: not moving accessed node to front immediately.","avoid":"AVOID: Sorting on each operation - use right data structure upfront. AVOID: One-size-fits-all (just a dict) when the operations require different structures. AVOID: Not reading the constraints - capacity, time bounds guide the design.","takeaway":"Design pattern: map each operation to what data structure gives that complexity. O(1) lookup  HashMap. O(1) insert/delete  doubly linked list (with dict of node references). O(log n) min/max  heap. Combine as needed."},"SQL":{"howToThink":"Ask: what TABLE TRANSFORMATION do I need Think in sets, not loops. SELECT (filter rows), GROUP BY (aggregate per group), HAVING (filter groups after aggregation), JOIN (combine tables), window functions (RANK, ROW_NUMBER, LAG, LEAD).","bruteForce":"Fetch all data in application code, filter/process there. Doesn't leverage SQL's set-based power.","bfComplexity":"O(n) in app code | high memory","optimalHint":"Use SQL directly: GROUP BY + COUNT/SUM/AVG + HAVING for filtered aggregations. JOIN for combining. Subquery or CTE (WITH clause) for intermediate results. Window functions for rank/position within partition.","optComplexity":"Depends on indexes, query planner | O(n)","mistakes":"1) NULL: use IS NULL not = NULL. 2) COUNT(*) counts all rows; COUNT(col) ignores NULLs. 3) HAVING is post-aggregation; WHERE is pre-aggregation. 4) Wrong JOIN: INNER removes non-matching; LEFT keeps all from left table.","avoid":"AVOID: Nested subqueries when window functions are cleaner. AVOID: GROUP BY when DISTINCT suffices. AVOID: HAVING without GROUP BY (valid but confusing). AVOID: Multiple self-JOINs when window functions work.","takeaway":"SQL toolkit: WHERE (filter), GROUP BY (aggregate), HAVING (filter groups), JOIN types (INNER/LEFT/RIGHT), subquery/CTE (intermediate steps), window functions (RANK/DENSE_RANK/ROW_NUMBER/LAG/LEAD). Practice these 6 and you can solve 90% of SQL interview problems."}},"problems":[{"d":1,"w":1,"m":"Month 1","ph":"Phase 1","t":"Create Hello World Function","u":"https://leetcode.com/problems/create-hello-world-function","diff":"Easy","c":"Array / Matrix"},{"d":1,"w":1,"m":"Month 1","ph":"Phase 1","t":"Majority Element","u":"https://leetcode.com/problems/majority-element","diff":"Easy","c":"Array / Matrix"},{"d":1,"w":1,"m":"Month 1","ph":"Phase 1","t":"Recyclable and Low Fat Products","u":"https://leetcode.com/problems/recyclable-and-low-fat-products","diff":"Easy","c":"Array / Matrix"},{"d":2,"w":1,"m":"Month 1","ph":"Phase 1","t":"Concatenation of Ar let state = { month: 1, phaseFilter: null, diffFilter: null, catFilter: '', search: '' };
let done = {};
try { done = JSON.parse(localStorage.getItem('dsa_done') || '{}'); } catch(e) { done = {}; }
function saveDone(){ try{ localStorage.setItem('dsa_done', JSON.stringify(done)); }catch(e){} }
function keyFor(p){ return p.m + '_' + p.d + '_' + p.t; }

const monthsOrder = Array.from({length:26}, (_,i)=>'Month '+(i+1));
const problemsByMonth = {};
monthsOrder.forEach(m=>problemsByMonth[m]=[]);
DATA.problems.forEach(p=>{ if(problemsByMonth[p.m]) problemsByMonth[p.m].push(p); });
Object.values(problemsByMonth).forEach(list=>list.sort((a,b)=>a.d-b.d));

const phases = Object.keys(DATA.phaseDesc);
const diffs = ['Easy','Medium','Hard'];
const cats = Object.keys(DATA.categories).sort();

function renderSidebarFilters(){
  const pf = document.getElementById('phaseFilters');
  pf.innerHTML = phases.map((p,i)=>`<span class="pill ${state.phaseFilter===p?'active':''}" data-phase="${p}"><button>${p}</button></span>`).join('');
  pf.querySelectorAll('.pill').forEach(el=>el.onclick=()=>{
    state.phaseFilter = state.phaseFilter === el.dataset.phase ? null : el.dataset.phase;
    render();
  });

  const df = document.getElementById('diffFilters');
  df.innerHTML = diffs.map(d=>`<span class="pill ${state.diffFilter===d?'active':''}" data-diff="${d}"><button>${d}</button></span>`).join('');
  df.querySelectorAll('.pill').forEach(el=>el.onclick=()=>{
    state.diffFilter = state.diffFilter === el.dataset.diff ? null : el.dataset.diff;
    render();
  });

  const cs = document.getElementById('catSelect');
  cs.innerHTML = '<option value="">All categories</option>' + cats.map(c=>`<option value="${c}">${c} (${DATA.problems.filter(p=>p.c===c).length})</option>`).join('');
  cs.value = state.catFilter;
  cs.onchange = ()=>{ state.catFilter = cs.value; render(); };
}

function renderMonthNav(){
  const el = document.getElementById('monthNavList');
  el.innerHTML = monthsOrder.map((m,i)=>{
    const list = problemsByMonth[m];
    const doneCount = list.filter(p=>done[keyFor(p)]).length;
    return `<button class="month-btn ${state.month===i+1?'active':''}" data-m="${i+1}">
      <span>${m}</span><span class="cnt">${doneCount}/${list.length}</span>
    </button>`;
  }).join('');
  el.querySelectorAll('.month-btn').forEach(b=>b.onclick=()=>{ state.month=parseInt(b.dataset.m); state.search=''; document.getElementById('searchBox').value=''; render(); });
}

function updateProgress(){
  const total = DATA.problems.length;
  const solved = DATA.problems.filter(p=>done[keyFor(p)]).length;
  document.getElementById('progressNum').textContent = solved;
  document.getElementById('progressLbl').textContent = `of ${total} solved`;
  document.getElementById('progressFill').style.width = (solved/total*100).toFixed(1)+'%';
}

function matchesFilters(p){
  if(state.phaseFilter && p.ph !== state.phaseFilter) return false;
  if(state.diffFilter && p.diff !== state.diffFilter) return false;
  if(state.catFilter && p.c !== state.catFilter) return false;
  return true;
}

function problemCard(p){
  const k = keyFor(p);
  const isDone = !!done[k];
  return `<div class="problem" data-k="${escapeAttr(k)}">
    <div class="problem-row" onclick="toggleOpen(this)">
      <input type="checkbox" class="chk" ${isDone?'checked':''} onclick="event.stopPropagation();toggleDone('${escapeAttr(k)}', this)">
      <span class="day-badge">D${p.d}</span>
      <span class="prob-title ${isDone?'done':''}">${escapeHtml(p.t)}</span>
      <span class="diff-pill diff-${p.diff}">${p.diff}</span>
      <span class="expand-icon">&#9656;</span>
    </div>
    <div class="problem-detail">${detailHtml(p)}</div>
  </div>`;
}

function detailHtml(p){
  const c = DATA.categories[p.c];
  return `
    <div class="detail-row"><span class="detail-label">Brute force</span><span class="detail-val">${escapeHtml(c.bruteForce)}</span> <span class="complexity">(${escapeHtml(c.bfComplexity)})</span></div>
    <div class="detail-row"><span class="detail-label">Optimal hint</span><span class="detail-val">${escapeHtml(c.optimalHint)}</span> <span class="complexity">(${escapeHtml(c.optComplexity)})</span></div>
    <div class="detail-row"><span class="detail-label">Common mistakes</span><span class="detail-val">${escapeHtml(c.mistakes)}</span></div>
    <div class="detail-row"><span class="detail-label">Avoid</span><span class="detail-val">${escapeHtml(c.avoid)}</span></div>
    <div class="detail-row"><span class="detail-label">Key takeaway</span><span class="detail-val">${escapeHtml(c.takeaway)}</span></div>
    <div class="detail-row"><a class="leet-link" href="${escapeAttr(p.u)}" target="_blank" rel="noopener">Open on LeetCode &#8594;</a></div>
  `;
}

function toggleOpen(rowEl){
  rowEl.parentElement.classList.toggle('open');
}
function toggleDone(k, chkEl){
  done[k] = chkEl.checked;
  saveDone();
  const titleEl = chkEl.closest('.problem-row').querySelector('.prob-title');
  titleEl.classList.toggle('done', chkEl.checked);
  updateProgress();
  renderMonthNav();
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function renderMonthPage(){
  const m = 'Month '+state.month;
  const list = problemsByMonth[m].filter(matchesFilters);
  const goal = DATA.monthGoals[m];
  const byCat = {};
  list.forEach(p=>{ (byCat[p.c] = byCat[p.c]||[]).push(p); });
  const catOrder = [...new Set(list.map(p=>p.c))];

  let html = `<div class="page-nav">
    <button class="nav-btn" id="prevBtn" ${state.month<=1?'disabled':''}>&#8592; Previous month</button>
    <span class="page-jump">Month ${state.month} of 26</span>
    <button class="nav-btn" id="nextBtn" ${state.month>=26?'disabled':''}>Next month &#8594;</button>
  </div>
  <div class="month-header">
    <span class="month-eyebrow">Month ${state.month}</span>
    <h1 class="month-title">${goal ? escapeHtml(goal.title) : 'Practice & Review'}</h1>
    ${goal ? `<p class="month-goal">${escapeHtml(goal.goal)}</p>` : `<p class="month-goal">Continued daily practice across mixed topics — 3 problems a day, consolidating everything from Months 1&ndash;4.</p>`}
  </div>`;

  if(list.length === 0){
    html += `<div class="empty-state">No problems match the current filters for this month.</div>`;
  } else {
    catOrder.forEach(cat=>{
      const items = byCat[cat];
      const g = DATA.categories[cat];
      html += `<div class="cat-block">
        <div class="cat-head"><span class="cat-name">${escapeHtml(cat)}</span><span class="cat-count">${items.length} problem${items.length>1?'s':''}</span></div>
        <div class="think-panel"><strong>How to think first —</strong> ${escapeHtml(g.howToThink)}</div>
        ${items.map(problemCard).join('')}
      </div>`;
    });
  }

  document.getElementById('mainArea').innerHTML = html;
  document.getElementById('prevBtn').onclick = ()=>{ if(state.month>1){ state.month--; render(); window.scrollTo(0,0);} };
  document.getElementById('nextBtn').onclick = ()=>{ if(state.month<26){ state.month++; render(); window.scrollTo(0,0);} };
}

function renderSearchResults(){
  const q = state.search.toLowerCase();
  const results = DATA.problems.filter(p=>matchesFilters(p) && p.t.toLowerCase().includes(q));
  let html = `<div class="month-header">
    <h1 class="search-results-title">${results.length} result${results.length!==1?'s':''} for "${escapeHtml(state.search)}"</h1>
  </div>`;
  if(results.length===0){
    html += `<div class="empty-state">No problems match your search.</div>`;
  } else {
    html += results.slice(0,300).map(p=>`<div class="cat-block" style="margin-bottom:0"><div style="margin-bottom:4px;color:var(--muted2);font-size:.76rem;font-family:var(--mono)">${escapeHtml(p.m)} · ${escapeHtml(p.c)}</div>${problemCard(p)}</div>`).join('');
  }
  document.getElementById('mainArea').innerHTML = html;
}

function render(){
  renderSidebarFilters();
  renderMonthNav();
  updateProgress();
  if(state.search.trim().length > 0){
    renderSearchResults();
  } else {
    renderMonthPage();
  }
}

document.getElementById('searchBox').addEventListener('input', (e)=>{
  state.search = e.target.value;
  render();
});

render();
</script>
</body>
</html>
