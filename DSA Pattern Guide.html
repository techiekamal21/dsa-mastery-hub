<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#656d76;--bd:#e3e1da;--ac:#4f46e5;--acbg:#eeedfd;--sc:#ecfdf5;--cl:#fff7ed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#1e2126;--tx:#e6e8eb;--mut:#9aa3ad;--bd:#2d3138;--ac:#a5a0ff;--acbg:#2a2a4a;--sc:#13302a;--cl:#3a2a17}}
:root[data-theme="dark"]{--bg:#16181c;--card:#1e2126;--tx:#e6e8eb;--mut:#9aa3ad;--bd:#2d3138;--ac:#a5a0ff;--acbg:#2a2a4a;--sc:#13302a;--cl:#3a2a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px}
header p{margin:0;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd);padding:10px 20px}
.bar-in{max-width:1100px;margin:0 auto}
#q{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab span{opacity:.6;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cnt{font-size:12px;color:var(--ac);background:var(--acbg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.box b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:2px}
.box p{margin:3px 0}
.sc{background:var(--sc)}.cl{background:var(--cl)}
ol{margin:10px 0 0;padding-left:22px}
li{margin:3px 0}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
mark{background:#fde68a;color:#000;border-radius:2px}

/* Hub Global Header */
.hub-header {
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: 0;
  z-index: 200;
  padding: 8px 20px;
}
.hub-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: 0 auto;
  gap: 12px;
}
.hub-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.hub-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--tx);
  text-decoration: none;
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.hub-brand:hover { text-decoration: none; }
.hub-brand-art {
  background: linear-gradient(135deg, #00e5ff 0%, #a855f7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hub-brand-sub {
  font-size: 0.62rem;
  font-family: monospace;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  display: block;
  line-height: 1;
  margin-top: 2px;
}
.hub-return-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--bg);
  border: 1px solid var(--bd);
  color: var(--mut);
  font-size: 0.76rem;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.2s ease;
}
.hub-return-btn:hover {
  color: var(--ac);
  border-color: var(--ac);
  text-decoration: none;
}
.hub-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--bd);
}
.hub-tab {
  padding: 5px 12px;
  border-radius: 6px;
  color: var(--mut);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.hub-tab:hover {
  color: var(--tx);
  text-decoration: none;
}
.hub-tab.active {
  background: var(--ac);
  color: #fff;
  font-weight: 700;
}
.hub-network {
  display: flex;
  align-items: center;
  gap: 6px;
}
.hub-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--bg);
  border: 1px solid var(--bd);
  color: var(--mut);
  text-decoration: none;
  font-size: 0.72rem;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.hub-pill:hover {
  color: var(--tx);
  border-color: var(--ac);
  text-decoration: none;
}
.hub-pill-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #00e5ff;
}
.hub-pill-linkedin:hover {
  color: #38bdf8;
  border-color: #0a66c2;
}
.bar { top: 52px !important; }
@media (max-width: 900px) {
  .hub-container { flex-wrap: wrap; }
  .hub-network { display: none; }
  .hub-tabs { width: 100%; justify-content: flex-start; overflow-x: auto; }
  .bar { top: 86px !important; }
}
</style></head><body>

let cur=0;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=DATA.reduce((a,d)=>a+d.pats.reduce((b,p)=>b+p.qs.length,0),0);
$('sub').textContent=DATA.length+' topics · '+DATA.reduce((a,d)=>a+d.pats.length,0)+' patterns · '+total+' problems';
function tabs(){
  $('tabs').innerHTML=DATA.map((d,i)=>`<button class="tab ${i===cur?'on':''}" data-i="${i}">${esc(d.topic)}<span>${d.pats.length}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;$('q').value='';render()});
}
function box(cls,label,arr){
  return arr.length?`<div class="box ${cls}"><b>${label}</b>${arr.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:'';
}
function render(){
  tabs();
  const q=$('q').value.trim().toLowerCase();
  const list=q?DATA.flatMap(d=>d.pats.map(p=>({...p,topic:d.topic}))):DATA[cur].pats;
  const hl=t=>{t=esc(t);if(!q)return t;const i=t.toLowerCase().indexOf(esc(q));return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length)};
  let out=list.map(p=>{
    const qs=q&&!p.name.toLowerCase().includes(q)?p.qs.filter(x=>x[0].toLowerCase().includes(q)):p.qs;
    if(q&&!qs.length)return'';
    return `<section class="card"><h3><span>${hl(p.name)}${p.topic?` <small style="color:var(--mut);font-weight:400">· ${esc(p.topic)}</small>`:''}</span><span class="cnt">${qs.length}</span></h3>
    ${box('sc','When to use',p.scen)}${box('cl','Clues',p.clue)}
    <ol>${qs.map(x=>`<li><a href="${esc(x[1])}" target="_blank" rel="noopener">${hl(x[0])}</a></li>`).join('')}</ol></section>`;
  }).join('');
  $('main').innerHTML=out||'<div class="empty">No matches.</div>';
}
$('q').oninput=render;
render();
